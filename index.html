<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paul Triana</title>
  <meta name="description" content="Paul Triana — generative AI, music, and creative technology. New site in progress.">
  <style>
    :root {
      --ink: #16161a;
      --muted: #5f5f6b;
      --paper: #fbfaf7;
      --line: #e6e3ee;
      --a1: #6d28d9;
      --a2: #db2777;
      --a3: #0891b2;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ececf1;
        --muted: #9a9aab;
        --paper: #0d0d13;
        --line: #26263a;
        --a1: #a78bfa;
        --a2: #f472b6;
        --a3: #22d3ee;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Soft drifting color glow behind everything */
    body::before {
      content: "";
      position: fixed;
      inset: -30vmax;
      z-index: -1;
      background:
        radial-gradient(35vmax 35vmax at 30% 35%, color-mix(in srgb, var(--a1) 22%, transparent), transparent 70%),
        radial-gradient(30vmax 30vmax at 70% 65%, color-mix(in srgb, var(--a2) 18%, transparent), transparent 70%),
        radial-gradient(25vmax 25vmax at 55% 25%, color-mix(in srgb, var(--a3) 14%, transparent), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to   { transform: translate(3%, 2%) rotate(8deg); }
    }

    main {
      width: 100%;
      max-width: 40rem;
      text-align: center;
    }

    /* --- the equalizer ------------------------------------------ */
    .eq {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 120px;
      margin: 0 auto 2.5rem;
    }

    .eq span {
      width: 6px;
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(180deg, var(--a3), var(--a1) 50%, var(--a2));
      transform-origin: center;
      animation: bounce 1.1s ease-in-out infinite;
      animation-delay: calc(var(--i) * -0.09s);
      animation-duration: calc(0.8s + var(--d) * 0.1s);
      opacity: 0.9;
    }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.12); }
      50%      { transform: scaleY(var(--h)); }
    }

    /* --- text ---------------------------------------------------- */
    h1 {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.05;
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }

    .name {
      background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3), var(--a1));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: flow 10s linear infinite;
    }

    @keyframes flow {
      from { background-position: 0% 0; }
      to   { background-position: 300% 0; }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 2rem;
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--a2);
      box-shadow: 0 0 0 0 var(--a2);
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--a2) 60%, transparent); }
      100% { box-shadow: 0 0 0 12px transparent; }
    }

    .status .ellipsis::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    /* Looping "rendering" progress bar */
    .progress {
      width: min(22rem, 100%);
      height: 4px;
      margin: 0 auto 2.5rem;
      border-radius: 4px;
      background: var(--line);
      overflow: hidden;
    }

    .progress::after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
      animation: load 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes load {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    p.about {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 auto 2rem;
      max-width: 32rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .links a {
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      background: color-mix(in srgb, var(--paper) 70%, transparent);
      backdrop-filter: blur(6px);
      transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .links a:hover {
      border-color: var(--a1);
      color: var(--a1);
      transform: translateY(-2px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .eq span { transform: scaleY(var(--h)); }
    }
  </style>
</head>
<body>
  <main>
    <div class="eq" aria-hidden="true"></div>

    <h1><span class="name">Paul Triana</span></h1>

    <div class="status">
      <span class="dot"></span>
      <span>new site in progress<span class="ellipsis"></span></span>
    </div>

    <div class="progress" aria-hidden="true"></div>

    <p class="about">
      Generative AI, music, and creative technology.
      MSc researcher at SFU's Metacreation Lab for Creative AI.
    </p>

    <nav class="links">
      <a href="https://iat806.paultriana.com">IAT 806 work</a>
      <a href="https://metacreation.net/team/paul-triana">Metacreation Lab</a>
      <a href="https://github.com/DaoTwenty">GitHub</a>
      <a href="mailto:paul_triana@sfu.ca">Email</a>
    </nav>
  </main>

  <script>
    // Build the equalizer bars, each with its own height and speed.
    var eq = document.querySelector(".eq");
    var count = window.innerWidth < 500 ? 22 : 36;
    for (var i = 0; i < count; i++) {
      var bar = document.createElement("span");
      // Taller in the middle, like a spectrum.
      var center = 1 - Math.abs(i - (count - 1) / 2) / (count / 2);
      bar.style.setProperty("--i", i);
      bar.style.setProperty("--d", Math.floor(Math.random() * 6));
      bar.style.setProperty("--h", (0.25 + center * 0.6 + Math.random() * 0.15).toFixed(2));
      eq.appendChild(bar);
    }
  </script>
</body>
</html>
